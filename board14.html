<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>1/4 bàn cờ — Canvas 2D</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #1a1a1a;
    display: flex; justify-content: center; align-items: center;
    font-family: system-ui, sans-serif;
  }
  #stage {
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    padding: 20px;
  }
  #label {
    color: #9ca3af; font-size: 13px; text-align: center;
  }
  #label b { color: #f59e0b; }
  canvas {
    display: block;
    border: 1px solid #333;
    box-shadow: 0 12px 48px rgba(0,0,0,0.6);
    border-radius: 4px;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="label">
    <b>1/4 bàn cờ</b> — góc dưới-trái (GREEN)<br>
    Canvas 600 × 600 — chuồng <code>1/4 L</code> · khung lên chuồng <code>1/8 L</code>
  </div>
  <canvas id="c" width="600" height="600"></canvas>
</div>

<script>
const ctx = document.getElementById('c').getContext('2d');

// ═══════════════════════════════════════════════════════════
//  MÀU SẮC
// ═══════════════════════════════════════════════════════════
const CREAM     = '#fef9c3';
const CREAM_2   = '#fde68a';
const CREAM_3   = '#fef3c7';
const GREEN     = '#22c55e';
const GREEN_D   = '#15803d';
const GREEN_L   = '#86efac';
const PURPLE    = '#7c3aed';
const PURPLE_D  = '#5b21b6';
const PURPLE_L  = '#c4b5fd';
const WHITE     = '#ffffff';
const GOLD      = '#a16207';
const GOLD_L    = '#fbbf24';
const BLACK     = '#111827';

// ═══════════════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════════════
function roundRect(x, y, w, h, r, fill, stroke, lw = 2) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}

function circle(cx, cy, r, fill, stroke, lw = 2) {
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}

// Cell track: vành vàng + fill xanh + highlight
function trackCell(cx, cy, r, fill, ringColor = GOLD) {
  circle(cx, cy, r, null, ringColor, 3);
  circle(cx, cy, r - 3, fill, null);
  ctx.beginPath();
  ctx.arc(cx, cy, r - 6, Math.PI * 1.15, Math.PI * 1.55);
  ctx.strokeStyle = 'rgba(255,255,255,0.65)';
  ctx.lineWidth = 3;
  ctx.stroke();
}

// Home-path cell: pill màu + vòng trắng + số
function homeCell(x, y, w, h, color, colorDark, number) {
  roundRect(x, y, w, h, 14, color, colorDark, 2.5);
  circle(x + w / 2, y + h / 2, Math.min(w, h) * 0.34, WHITE, null);
  ctx.fillStyle = colorDark;
  ctx.font = `bold ${Math.min(w, h) * 0.44}px system-ui, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(String(number), x + w / 2, y + h / 2 + 1);
}

// Quân cờ xanh (đơn giản hoá)
function greenPiece(cx, cy, scale = 1) {
  // bóng
  ctx.beginPath();
  ctx.ellipse(cx, cy + 24 * scale, 26 * scale, 9 * scale, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.fill();
  // đế
  ctx.beginPath();
  ctx.ellipse(cx, cy + 20 * scale, 24 * scale, 9 * scale, 0, 0, Math.PI * 2);
  ctx.fillStyle = GREEN_D;
  ctx.fill();
  // thân (giọt nước)
  ctx.beginPath();
  ctx.moveTo(cx - 22 * scale, cy + 18 * scale);
  ctx.quadraticCurveTo(cx - 16 * scale, cy - 26 * scale, cx, cy - 36 * scale);
  ctx.quadraticCurveTo(cx + 16 * scale, cy - 26 * scale, cx + 22 * scale, cy + 18 * scale);
  ctx.closePath();
  ctx.fillStyle = GREEN;
  ctx.fill();
  // highlight
  ctx.beginPath();
  ctx.ellipse(cx - 5 * scale, cy - 8 * scale, 5 * scale, 13 * scale, -0.3, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fill();
}

// ═══════════════════════════════════════════════════════════
//  NỀN
// ═══════════════════════════════════════════════════════════
ctx.fillStyle = CREAM;
ctx.fillRect(0, 0, 600, 600);

// ═══════════════════════════════════════════════════════════
//  1) GREEN STABLE — vuông 1/4 L ở góc dưới-trái
//  Stable side = 300 (1/2 của quadrant 600 = 1/4 của board)
// ═══════════════════════════════════════════════════════════
const SX = 5, SY = 300, SW = 290, SH = 290;
roundRect(SX, SY, SW, SH, 6, CREAM_3, GREEN_D, 4);

// 4 quân xanh bên trong (2×2)
greenPiece(SX + 75,  SY + 78);
greenPiece(SX + 215, SY + 78);
greenPiece(SX + 75,  SY + 215);
greenPiece(SX + 215, SY + 215);

// ═══════════════════════════════════════════════════════════
//  2) GREEN HOME PATH — 6 ô pill ngang ở trên
//  Số 1 → 6 đi từ trái (edge) sang phải (center)
// ═══════════════════════════════════════════════════════════
const HP_X0 = 70, HP_Y = 18, HP_CW = 72, HP_CH = 64;
for (let i = 0; i < 6; i++) {
  const x = HP_X0 + i * (HP_CW + 2);
  homeCell(x, HP_Y, HP_CW, HP_CH, GREEN, GREEN_D, i + 1);
}

// ═══════════════════════════════════════════════════════════
//  3) GREEN TRACK ROW — 7 ô tròn ngang dưới home path
//  Ô trái nhất = START (có hình đầu ngựa)
// ═══════════════════════════════════════════════════════════
const TR_Y = 148, TR_R = 28;
const TR_X0 = 42, TR_SP = 74;

// 6 ô tròn xanh bình thường
for (let i = 1; i < 7; i++) {
  trackCell(TR_X0 + i * TR_SP, TR_Y, TR_R, GREEN);
}

// Ô START — hình đầu ngựa
(function drawStart() {
  const cx = TR_X0, cy = TR_Y;
  circle(cx, cy, TR_R, null, GOLD, 3);
  circle(cx, cy, TR_R - 3, GREEN_D, null);
  ctx.save();
  ctx.translate(cx, cy);
  ctx.fillStyle = WHITE;
  // silhouette đầu ngựa đơn giản
  ctx.beginPath();
  ctx.moveTo(-11, 7);
  ctx.lineTo(-9, -3);
  ctx.quadraticCurveTo(-12, -7, -10, -11);
  ctx.lineTo(-8, -10);
  ctx.quadraticCurveTo(-5, -5, -1, -4);
  ctx.quadraticCurveTo(5, -3, 8, 2);
  ctx.quadraticCurveTo(10, 6, 7, 7);
  ctx.quadraticCurveTo(5, 3, 2, 5);
  ctx.quadraticCurveTo(1, 8, -3, 8);
  ctx.quadraticCurveTo(-6, 8, -7, 6);
  ctx.closePath();
  ctx.fill();
  // mắt
  ctx.beginPath();
  ctx.arc(-2, -2, 1.4, 0, Math.PI * 2);
  ctx.fillStyle = GREEN_D;
  ctx.fill();
  ctx.restore();
})();

// ═══════════════════════════════════════════════════════════
//  4) GREEN TRACK COLUMN — 5 ô tròn dọc phía phải
// ═══════════════════════════════════════════════════════════
const TC_X = 478, TC_R = 28;
const TC_Y0 = 205, TC_SP = 72;
for (let i = 0; i < 5; i++) {
  trackCell(TC_X, TC_Y0 + i * TC_SP, TC_R, GREEN);
}

// ═══════════════════════════════════════════════════════════
//  5) PURPLE HOME PATH — 6 ô pill dọc ở phải
//  Số 6 → 1 đi từ trên (center) xuống dưới (edge)
// ═══════════════════════════════════════════════════════════
const PH_X = 524, PH_Y0 = 165, PH_CW = 68, PH_CH = 62;
for (let i = 0; i < 6; i++) {
  const y = PH_Y0 + i * (PH_CH + 2);
  homeCell(PH_X, y, PH_CW, PH_CH, PURPLE, PURPLE_D, 6 - i);
}

// ═══════════════════════════════════════════════════════════
//  6) VIỀN NGOÀI (biên bàn cờ — chỉ 2 cạnh trái & dưới)
// ═══════════════════════════════════════════════════════════
ctx.strokeStyle = '#78350f';
ctx.lineWidth = 4;
ctx.beginPath();
ctx.moveTo(2, 2);
ctx.lineTo(2, 597);
ctx.lineTo(597, 597);
ctx.lineTo(597, 2);
ctx.stroke();

// ═══════════════════════════════════════════════════════════
//  7) NHÃN DEBUG (tuỳ chọn)
// ═══════════════════════════════════════════════════════════
ctx.fillStyle = 'rgba(120, 60, 0, 0.55)';
ctx.font = 'bold 11px system-ui';
ctx.textAlign = 'left';
ctx.textBaseline = 'top';
ctx.fillText('HOME PATH (1-6)',  70, 4);
ctx.fillText('TRACK ROW',         42, 188);
ctx.fillText('TRACK COLUMN',      440, 188);
ctx.fillText('PURPLE HOME (6-1)', 522, 148);
ctx.fillText('GREEN STABLE',      12, 590 - 4 - 11);

// ═══════════════════════════════════════════════════════════
//  8) CHÚ THÍCH KÍCH THƯỚC (đo mẫu)
// ═══════════════════════════════════════════════════════════
ctx.font = '10px ui-monospace, monospace';
ctx.fillStyle = 'rgba(0,0,0,0.4)';
ctx.textAlign = 'right';
ctx.fillText('Stable = 1/4 L = 300px (theoretical)', 590, 585);
</script>
</body>
</html>
